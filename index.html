<style>
  :root {
    --bg: #17140f;
    --panel: #fbf7ee;
    --ink: #211c15;
    --ink-soft: #6f6656;
    --rule: #e3dac5;
    --brass: #a9793c;
    --brass-deep: #8a6230;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 6vh 20px 10vh; }
  .sheet { width: 100%; max-width: 560px; }
  h1 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600; font-optical-sizing: auto;
    font-size: clamp(28px, 5vw, 38px);
    color: var(--panel); text-align: center; margin: 0 0 6px; letter-spacing: 0.2px;
  }
  .subhead { text-align: center; color: #b9ad91; font-size: 13px; margin: 0 0 34px; line-height: 1.5; min-height: 18px; }
  .search-wrap { position: relative; margin: 0 auto; }
  #search {
    width: 100%; font-family: inherit; font-size: 17px; padding: 16px 20px;
    border-radius: 3px; border: 1px solid var(--rule); background: var(--panel);
    color: var(--ink); outline: none; box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  #search::placeholder { color: #a89e88; }
  #search:focus { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(169,121,60,0.28); }
  .caption { text-align: center; font-size: 12px; color: #8f8570; margin: 10px 4px 0; line-height: 1.6; }
  .caption b { color: #cabb98; font-weight: 500; }
  .status { margin: 30px 0 10px; font-size: 12px; color: #a89e88; display: flex; justify-content: space-between; padding: 0 2px; }
  .results { list-style: none; margin: 0; padding: 0; border-top: 1px solid #35301f; }
  .row { padding: 14px 4px; border-bottom: 1px solid #35301f; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .row .item { color: var(--panel); font-size: 15px; line-height: 1.4; cursor: pointer; }
  .row .loc { flex-shrink: 0; text-align: right; font-size: 11px; line-height: 1.6; cursor: pointer; }
  .row .loc .box { color: var(--brass); display: block; }
  .row .loc .tub { color: #77705d; display: block; }
  .row .rowActions { display: flex; gap: 6px; flex-shrink: 0; }
  .rowBtn {
    background: none; border: 1px solid #35301f; color: #a89e88; font-family: inherit;
    font-size: 12px; line-height: 1; padding: 5px 7px; border-radius: 3px; cursor: pointer;
  }
  .rowBtn:hover { border-color: var(--brass); color: var(--brass); }
  .rowBtn.dangerBtn:hover { border-color: #c97b6b; color: #c97b6b; }
  .rowBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .empty { text-align: center; color: #6f6656; font-size: 13px; padding: 40px 10px 0; }

  .addSection { margin-top: 44px; border-top: 1px solid #35301f; padding-top: 20px; }
  .linklike {
    background: none; border: none; color: var(--brass); font-family: inherit;
    font-size: 13px; cursor: pointer; padding: 4px 0; margin-right: 16px;
  }
  .linklike:hover { color: var(--panel); }
  .addForm[hidden] { display: none; }
  .addForm { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
  .addForm label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: #a89e88; }
  .addForm input[type="text"], .addForm select {
    font-family: inherit; font-size: 14px; padding: 11px 12px; border-radius: 3px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink); outline: none;
  }
  .addForm input[type="text"]:focus, .addForm select:focus {
    border-color: var(--brass); box-shadow: 0 0 0 3px rgba(169,121,60,0.28);
  }
  .addForm input[hidden] { display: none; }
  .formButtons { display: flex; gap: 10px; align-items: center; }
  .addForm button[type="submit"] {
    font-family: inherit; font-size: 14px; padding: 12px; border-radius: 3px; border: none;
    background: var(--brass); color: #1a1610; font-weight: 600; cursor: pointer;
    transition: background 0.15s ease; flex: 1;
  }
  .addForm button[type="submit"]:hover { background: var(--brass-deep); }
  .addForm button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  .cancelEditBtn {
    font-family: inherit; font-size: 13px; padding: 12px 14px; border-radius: 3px;
    border: 1px solid var(--rule); background: none; color: #a89e88; cursor: pointer;
  }
  .cancelEditBtn:hover { border-color: var(--panel); color: var(--panel); }
  .addStatus { font-size: 12px; color: #a89e88; text-align: center; min-height: 16px; }
  .addStatus.err { color: #c97b6b; }
  .addStatus.ok { color: #9db98a; }
  .offlineNote { text-align: center; font-size: 11px; color: #6f6656; margin-top: 10px; line-height: 1.6; }
  .seedBtn {
    display: block; margin: 16px auto 0; font-family: inherit; font-size: 12px;
    padding: 8px 14px; border-radius: 3px; border: 1px dashed var(--brass);
    background: none; color: var(--brass); cursor: pointer;
  }
  .seedBtn:hover { background: rgba(169,121,60,0.12); }

  .managePanel[hidden] { display: none; }
  .managePanel { margin-top: 16px; display: flex; flex-direction: column; gap: 18px; }
  .tubBlock { border: 1px solid #35301f; border-radius: 4px; padding: 12px; }
  .tubRow, .boxRow { display: flex; gap: 8px; align-items: center; }
  .tubRow input[type="text"], .boxRow input[type="text"] {
    flex: 1; font-family: inherit; font-size: 13px; padding: 8px 10px; border-radius: 3px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink); outline: none;
  }
  .tubRow input[type="text"]:focus, .boxRow input[type="text"]:focus {
    border-color: var(--brass); box-shadow: 0 0 0 3px rgba(169,121,60,0.28);
  }
  .boxList { margin: 10px 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .manageStatus { font-size: 11px; color: #a89e88; margin-top: 6px; min-height: 14px; }
  .manageStatus.err { color: #c97b6b; }
  .manageStatus.ok { color: #9db98a; }
</style>
</head>
<body>
  <div class="sheet">
    <h1>Box Manifest</h1>
    <p class="subhead" id="subhead">Find anything without knowing exactly what it's called.</p>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search for anything…" autocomplete="off" autofocus />
    </div>
    <p class="caption">Try a partial word, a box number, or a tub &mdash; like <b>card</b>, <b>box 008</b>, or <b>tub c</b>.</p>

    <div class="status" id="status" style="display:none;">
      <span id="count"></span>
      <span>tap a name to copy</span>
    </div>
    <ul class="results" id="results"></ul>
    <div class="empty" id="emptyState">Start typing above &mdash; results will show up here.</div>

    <div class="addSection">
      <button id="toggleAdd" class="linklike" type="button">+ Add an item</button>
      <button id="toggleManage" class="linklike" type="button">Manage tubs &amp; boxes</button>

      <form id="addForm" class="addForm" hidden>
        <label>Item name
          <input id="newItemName" type="text" placeholder="e.g. spare thumb tip" required />
        </label>

        <label>Tub
          <select id="tubSelect"></select>
        </label>
        <input id="newTubName" type="text" placeholder="New tub name" hidden />

        <label>Box (leave as "loose" if it isn't boxed)
          <select id="boxSelect"></select>
        </label>
        <input id="newBoxName" type="text" placeholder="New box name" hidden />

        <div class="formButtons">
          <button type="submit" id="submitBtn">Add item</button>
          <button type="button" id="cancelEditBtn" class="cancelEditBtn" hidden>Cancel</button>
        </div>
        <div class="addStatus" id="addStatus"></div>
      </form>

      <div class="managePanel" id="managePanel" hidden>
        <div id="manageList"></div>
        <div class="manageStatus" id="manageStatus"></div>
      </div>

      <p class="offlineNote" id="offlineNote" style="display:none;"></p>
      <button id="seedBtn" class="seedBtn" type="button" style="display:none;">Import starter data (154 items)</button>
    </div>
  </div>

  function slug(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');

  function stem(term) {
    return term.endsWith('s') && term.length > 1 ? term.slice(0, -1) : term;

  function blob(row) {
    return (row.item + ' ' + row.container + ' ' + row.tub).toLowerCase();

  function renderResults(query) {
    const q = query.trim().toLowerCase();

    if (!q) {
      resultsEl.innerHTML = '';
      statusEl.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Start typing above — results will show up here.';
      return;
    }

    const s = stem(q);
    const matches = STATE.items.filter(row => {
      const b = blob(row);
      return b.includes(q) || b.includes(s);
    });

    emptyEl.style.display = matches.length ? 'none' : 'block';
    if (!matches.length) {
      emptyEl.textContent = 'Nothing matches "' + query.trim() + '". Try a shorter or different word.';
      resultsEl.innerHTML = '';
      statusEl.style.display = 'none';
      return;

    statusEl.style.display = 'flex';
    countEl.textContent = matches.length + (matches.length === 1 ? ' match' : ' matches');

      '<li class="row" data-id="' + escapeHtml(row.id || '') + '">' +
        '<span class="item" data-copy="' + row.item.replace(/"/g, '&quot;') + '">' + escapeHtml(row.item) + '</span>' +

    newItemName.focus();
  }

  function closeAddForm() {
    editingItemId = null;
    addForm.hidden = true;
    toggleAddBtn.textContent = '+ Add an item';
  }

  function openEditForm(item) {
    managePanel.hidden = true;
    toggleManageBtn.textContent = 'Manage tubs & boxes';
    editingItemId = item.id;
    addForm.hidden = false;
    toggleAddBtn.textContent = '– Close';
    submitBtn.textContent = 'Save changes';
    cancelEditBtn.hidden = false;
    addStatus.textContent = '';
    addStatus.className = 'addStatus';
    newItemName.value = item.item;
    populateTubSelect();
    tubSelect.value = item.tub;
    populateBoxSelect();
    const isLoose = item.container === (item.tub + ' (loose)');
    boxSelect.value = isLoose ? LOOSE_VALUE : item.container;
    newTubName.hidden = true;
    newBoxName.hidden = true;
    newItemName.focus();
    addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  toggleAddBtn.addEventListener('click', () => {
    if (!addForm.hidden) { closeAddForm(); return; }
    openAddForm();
  });

  cancelEditBtn.addEventListener('click', () => closeAddForm());

  tubSelect.addEventListener('change', () => {
    newTubName.hidden = tubSelect.value !== NEW_VALUE;
    if (tubSelect.value !== NEW_VALUE) populateBoxSelect();
    else boxSelect.innerHTML = '<option value="' + LOOSE_VALUE + '">Loose in the tub (no box)</option>';
  });

  boxSelect.addEventListener('change', () => {
    newBoxName.hidden = boxSelect.value !== NEW_VALUE;
  });

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!db) return;

    const itemName = newItemName.value.trim();
    if (!itemName) return;

    const tubName = tubSelect.value === NEW_VALUE ? newTubName.value.trim() : tubSelect.value;
    if (!tubName) {
      addStatus.textContent = 'Enter a tub name.';
      addStatus.className = 'addStatus err';
      return;
    }

    let container, newBox = null;
    if (boxSelect.value === LOOSE_VALUE) {
      container = tubName + ' (loose)';
    } else if (boxSelect.value === NEW_VALUE) {
      const boxName = newBoxName.value.trim();
      if (!boxName) {
        addStatus.textContent = 'Enter a box name.';
        addStatus.className = 'addStatus err';
        return;
      }
      container = boxName;
      if (!STATE.boxes.some(b => b.name === boxName && b.tub === tubName)) newBox = { name: boxName, tub: tubName };
    } else {
      container = boxSelect.value;
    }

    const isNewTub = !STATE.tubs.some(t => t.name === tubName);

    submitBtn.disabled = true;
    addStatus.textContent = 'Saving…';
    addStatus.className = 'addStatus';

    try {
      if (isNewTub) {
        const tubId = slug(tubName);
        await setDoc(doc(db, 'tubs', tubId), { name: tubName });
        STATE.tubs.push({ id: tubId, name: tubName });
      }
      if (newBox) {
        const boxId = slug(newBox.tub) + '__' + slug(newBox.name);
        await setDoc(doc(db, 'boxes', boxId), newBox);
        STATE.boxes.push({ id: boxId, ...newBox });
      }

      if (editingItemId) {
        await updateDoc(doc(db, 'items', editingItemId), { item: itemName, container, tub: tubName });
        const idx = STATE.items.findIndex(i => i.id === editingItemId);
        if (idx !== -1) STATE.items[idx] = { id: editingItemId, item: itemName, container, tub: tubName };
        addStatus.textContent = 'Saved.';
      } else {
        const ref = await addDoc(collection(db, 'items'), { item: itemName, container, tub: tubName });
        STATE.items.push({ id: ref.id, item: itemName, container, tub: tubName });
        addStatus.textContent = 'Added.';
      }

      addStatus.className = 'addStatus ok';
      updateSubhead();
      if (searchEl.value.trim()) renderResults(searchEl.value);
      closeAddForm();
    } catch (err) {
      addStatus.textContent = 'Could not save — try again.';
      addStatus.className = 'addStatus err';
    }
    submitBtn.disabled = false;
  });

  async function deleteItem(item) {
    if (!db) return;
    if (!confirm('Delete "' + item.item + '"?')) return;
    try {
      await deleteDoc(doc(db, 'items', item.id));
      STATE.items = STATE.items.filter(i => i.id !== item.id);
      updateSubhead();
      renderResults(searchEl.value);
    } catch (err) {
      alert('Could not delete that item — try again.');
    }
  }

  // ---- Manage tubs & boxes ----

  function itemCountForTub(tubName) {
    return STATE.items.filter(i => i.tub === tubName).length;
  }
  function boxCountForTub(tubName) {
    return STATE.boxes.filter(b => b.tub === tubName).length;
  }
  function itemCountForBox(tubName, boxName) {
    return STATE.items.filter(i => i.tub === tubName && i.container === boxName).length;
  }

  function renderManageList() {
    manageList.innerHTML = STATE.tubs.map(tub => {
      const boxesHtml = STATE.boxes.filter(b => b.tub === tub.name).map(box => {
        const boxItemCount = itemCountForBox(tub.name, box.name);
        const delTitle = boxItemCount ? 'Move or delete its ' + boxItemCount + ' item(s) first' : 'Delete this box';
        return (
          '<div class="boxRow" data-box-id="' + escapeHtml(box.id) + '">' +
            '<input type="text" class="boxNameInput" value="' + escapeHtml(box.name) + '">' +
            '<button type="button" class="rowBtn" data-action="save-box">Save</button>' +
            '<button type="button" class="rowBtn dangerBtn" data-action="delete-box" title="' + delTitle + '"' +
              (boxItemCount ? ' disabled' : '') + '>Delete</button>' +
          '</div>'
        );
      }).join('');

      const tubItemCount = itemCountForTub(tub.name);
      const tubBoxCount = boxCountForTub(tub.name);
      const blockers = tubItemCount + tubBoxCount;
      const delTitle = blockers ? 'Move or delete its items and boxes first' : 'Delete this tub';

      return (
        '<div class="tubBlock" data-tub-id="' + escapeHtml(tub.id) + '">' +
          '<div class="tubRow">' +
            '<input type="text" class="tubNameInput" value="' + escapeHtml(tub.name) + '">' +
            '<button type="button" class="rowBtn" data-action="save-tub">Save</button>' +
            '<button type="button" class="rowBtn dangerBtn" data-action="delete-tub" title="' + delTitle + '"' +
              (blockers ? ' disabled' : '') + '>Delete</button>' +
          '</div>' +
          (boxesHtml ? '<div class="boxList">' + boxesHtml + '</div>' : '') +
        '</div>'
      );
    }).join('');
  }

  toggleManageBtn.addEventListener('click', () => {
    if (!managePanel.hidden) {
      managePanel.hidden = true;
      toggleManageBtn.textContent = 'Manage tubs & boxes';
      return;
    }
    closeAddForm();
    managePanel.hidden = false;
    toggleManageBtn.textContent = '– Close';
    manageStatus.textContent = '';
    renderManageList();
  });

  manageList.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const action = btn.getAttribute('data-action');

    if (action === 'save-tub' || action === 'delete-tub') {
      const block = btn.closest('.tubBlock');
      const tubId = block.getAttribute('data-tub-id');
      const tub = STATE.tubs.find(t => t.id === tubId);
      if (!tub) return;
      if (action === 'save-tub') {
        const newName = block.querySelector('.tubNameInput').value.trim();
        if (!newName || newName === tub.name) return;
        await renameTub(tub, newName);
      } else {
        await deleteTub(tub);
      }
    }

    if (action === 'save-box' || action === 'delete-box') {
      const row = btn.closest('.boxRow');
      const boxId = row.getAttribute('data-box-id');
      const box = STATE.boxes.find(b => b.id === boxId);
      if (!box) return;
      if (action === 'save-box') {
        const newName = row.querySelector('.boxNameInput').value.trim();
        if (!newName || newName === box.name) return;
        await renameBox(box, newName);
      } else {
        await deleteBox(box);
      }
    }
  });

  async function renameTub(tub, newName) {
    manageStatus.textContent = 'Saving…';
    manageStatus.className = 'manageStatus';
    try {
      const oldName = tub.name;
      const oldLoose = oldName + ' (loose)';
      const newLoose = newName + ' (loose)';
      const batch = writeBatch(db);
      batch.update(doc(db, 'tubs', tub.id), { name: newName });
      STATE.items.forEach(i => {
        if (i.tub === oldName) {
          const newContainer = i.container === oldLoose ? newLoose : i.container;
          batch.update(doc(db, 'items', i.id), { tub: newName, container: newContainer });
        }
      });
      STATE.boxes.forEach(b => {
        if (b.tub === oldName) batch.update(doc(db, 'boxes', b.id), { tub: newName });
      });
      await batch.commit();

      tub.name = newName;
      STATE.items.forEach(i => {
        if (i.tub === oldName) { i.container = i.container === oldLoose ? newLoose : i.container; i.tub = newName; }
      });
      STATE.boxes.forEach(b => { if (b.tub === oldName) b.tub = newName; });

      manageStatus.textContent = 'Renamed.';
      manageStatus.className = 'manageStatus ok';
      renderManageList();
      updateSubhead();
      if (searchEl.value.trim()) renderResults(searchEl.value);
    } catch (err) {
      manageStatus.textContent = 'Could not rename — try again.';
      manageStatus.className = 'manageStatus err';
    }
  }

  async function deleteTub(tub) {
    if (itemCountForTub(tub.name) || boxCountForTub(tub.name)) return;
    if (!confirm('Delete tub "' + tub.name + '"?')) return;
    manageStatus.textContent = 'Deleting…';
    manageStatus.className = 'manageStatus';
    try {
      await deleteDoc(doc(db, 'tubs', tub.id));
      STATE.tubs = STATE.tubs.filter(t => t.id !== tub.id);
      manageStatus.textContent = 'Deleted.';
      manageStatus.className = 'manageStatus ok';
      renderManageList();
      updateSubhead();
    } catch (err) {
      manageStatus.textContent = 'Could not delete — try again.';
      manageStatus.className = 'manageStatus err';
    }
  }

  async function renameBox(box, newName) {
    manageStatus.textContent = 'Saving…';
    manageStatus.className = 'manageStatus';
    try {
      const oldName = box.name;
      const batch = writeBatch(db);
      batch.update(doc(db, 'boxes', box.id), { name: newName });
      STATE.items.forEach(i => {
        if (i.tub === box.tub && i.container === oldName) batch.update(doc(db, 'items', i.id), { container: newName });
      });
      await batch.commit();

      box.name = newName;
      STATE.items.forEach(i => { if (i.tub === box.tub && i.container === oldName) i.container = newName; });

      manageStatus.textContent = 'Renamed.';
      manageStatus.className = 'manageStatus ok';
      renderManageList();
      if (searchEl.value.trim()) renderResults(searchEl.value);
    } catch (err) {
      manageStatus.textContent = 'Could not rename — try again.';
      manageStatus.className = 'manageStatus err';
    }
  }

  async function deleteBox(box) {
    if (itemCountForBox(box.tub, box.name)) return;
    if (!confirm('Delete box "' + box.name + '"?')) return;
    manageStatus.textContent = 'Deleting…';
    manageStatus.className = 'manageStatus';
    try {
      await deleteDoc(doc(db, 'boxes', box.id));
      STATE.boxes = STATE.boxes.filter(b => b.id !== box.id);
      manageStatus.textContent = 'Deleted.';
      manageStatus.className = 'manageStatus ok';
      renderManageList();
      updateSubhead();
    } catch (err) {
      manageStatus.textContent = 'Could not delete — try again.';
      manageStatus.className = 'manageStatus err';
    }
  }

  // ---- One-time seed of the starter 154 items ----

  seedBtn.addEventListener('click', async () => {
    if (!db) return;
    seedBtn.disabled = true;
    seedBtn.textContent = 'Importing…';
    try {
      const batch = writeBatch(db);
      FALLBACK.tubs.forEach(t => batch.set(doc(db, 'tubs', t.id), { name: t.name }));
      FALLBACK.boxes.forEach(b => batch.set(doc(db, 'boxes', b.id), { name: b.name, tub: b.tub }));
      FALLBACK.items.forEach(it => batch.set(doc(db, 'items', it.id), { item: it.item, container: it.container, tub: it.tub }));
      await batch.commit();
      seedBtn.style.display = 'none';
      await loadFromFirestore();
    } catch (err) {
      seedBtn.disabled = false;
      seedBtn.textContent = 'Import failed — try again';
    }
  });

  // ---- Load live data from Firestore ----

  async function loadFromFirestore() {
    if (!isConfigured) {
      toggleAddBtn.style.display = 'none';
      toggleManageBtn.style.display = 'none';
      offlineNote.style.display = 'block';
      offlineNote.textContent = 'Add your Firebase config near the top of this file to enable adding, editing, and managing items.';
      return;
    }
    try {
      const [tubsSnap, boxesSnap, itemsSnap] = await Promise.all([
        getDocs(query(collection(db, 'tubs'), limit(1000))),
        getDocs(query(collection(db, 'boxes'), limit(1000))),
        getDocs(query(collection(db, 'items'), limit(1000))),
      ]);

      if (itemsSnap.size) {
        STATE.items = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        seedBtn.style.display = 'none';
      } else {
        seedBtn.style.display = 'block';
      }
      if (tubsSnap.size) STATE.tubs = tubsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (boxesSnap.size) STATE.boxes = boxesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      updateSubhead();
      if (searchEl.value.trim()) renderResults(searchEl.value);
      if (!addForm.hidden) { populateTubSelect(); populateBoxSelect(); }
      if (!managePanel.hidden) renderManageList();
    } catch (err) {
      toggleAddBtn.style.display = 'none';
      toggleManageBtn.style.display = 'none';
      offlineNote.style.display = 'block';
      offlineNote.textContent = 'Could not reach Firestore — check your config and security rules. Search still works from the built-in snapshot.';
    }
  }

  updateSubhead();
  renderResults('');
  loadFromFirestore();
</script>
</body>
</html>
