<style>
  :root {
    --bg: #17140f;
    --panel: #fbf7ee;
    --ink: #211c15;
    --ink-soft: #6f6656;
    --rule: #e3dac5;
    --brass: #a9793c;
    --brass-deep: #8a6230;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 6vh 20px 10vh; }
  .sheet { width: 100%; max-width: 560px; }
  h1 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600; font-optical-sizing: auto;
    font-size: clamp(28px, 5vw, 38px);
    color: var(--panel); text-align: center; margin: 0 0 6px; letter-spacing: 0.2px;
  }
  .subhead { text-align: center; color: #b9ad91; font-size: 13px; margin: 0 0 34px; line-height: 1.5; min-height: 18px; }
  .search-wrap { position: relative; margin: 0 auto; }
  #search {
    width: 100%; font-family: inherit; font-size: 17px; padding: 16px 20px;
    border-radius: 3px; border: 1px solid var(--rule); background: var(--panel);
    color: var(--ink); outline: none; box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  #search::placeholder { color: #a89e88; }
  #search:focus { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(169,121,60,0.28); }
  .caption { text-align: center; font-size: 12px; color: #8f8570; margin: 10px 4px 0; line-height: 1.6; }
  .caption b { color: #cabb98; font-weight: 500; }
  .status { margin: 30px 0 10px; font-size: 12px; color: #a89e88; display: flex; justify-content: space-between; padding: 0 2px; }
  .results { list-style: none; margin: 0; padding: 0; border-top: 1px solid #35301f; }
  .row { padding: 14px 4px; border-bottom: 1px solid #35301f; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .row .item { color: var(--panel); font-size: 15px; line-height: 1.4; }
  .row .loc { flex-shrink: 0; text-align: right; font-size: 11px; line-height: 1.6; }
  .row .loc .box { color: var(--brass); display: block; }
  .row .loc .tub { color: #77705d; display: block; }
  .empty { text-align: center; color: #6f6656; font-size: 13px; padding: 40px 10px 0; }

  .addSection { margin-top: 44px; border-top: 1px solid #35301f; padding-top: 20px; }
  .linklike {
    background: none; border: none; color: var(--brass); font-family: inherit;
    font-size: 13px; cursor: pointer; padding: 4px 0;
  }
  .linklike:hover { color: var(--panel); }
  .addForm[hidden] { display: none; }
  .addForm { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
  .addForm label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: #a89e88; }
  .addForm input[type="text"], .addForm select {
    font-family: inherit; font-size: 14px; padding: 11px 12px; border-radius: 3px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink); outline: none;
  }
  .addForm input[type="text"]:focus, .addForm select:focus {
    border-color: var(--brass); box-shadow: 0 0 0 3px rgba(169,121,60,0.28);
  }
  .addForm input[hidden] { display: none; }
  .addForm button[type="submit"] {
    font-family: inherit; font-size: 14px; padding: 12px; border-radius: 3px; border: none;
    background: var(--brass); color: #1a1610; font-weight: 600; cursor: pointer;
    transition: background 0.15s ease;
  }
  .addForm button[type="submit"]:hover { background: var(--brass-deep); }
  .addForm button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  .addStatus { font-size: 12px; color: #a89e88; text-align: center; min-height: 16px; }
  .addStatus.err { color: #c97b6b; }
  .addStatus.ok { color: #9db98a; }
  .offlineNote { text-align: center; font-size: 11px; color: #6f6656; margin-top: 10px; }
</style>
</head>
<body>
  <div class="sheet">
    <h1>Box Manifest</h1>
    <p class="subhead" id="subhead">Find anything without knowing exactly what it's called.</p>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search for anything…" autocomplete="off" autofocus />
    </div>
    <p class="caption">Try a partial word, a box number, or a tub &mdash; like <b>card</b>, <b>box 008</b>, or <b>tub c</b>.</p>

    <div class="status" id="status" style="display:none;">
      <span id="count"></span>
      <span>tap to copy an item</span>
    </div>
    <ul class="results" id="results"></ul>
    <div class="empty" id="emptyState">Start typing above &mdash; results will show up here.</div>

    <div class="addSection">
      <button id="toggleAdd" class="linklike" type="button">+ Add an item</button>
      <form id="addForm" class="addForm" hidden>
        <label>Item name
          <input id="newItemName" type="text" placeholder="e.g. spare thumb tip" required />
        </label>

        <label>Tub
          <select id="tubSelect"></select>
        </label>
        <input id="newTubName" type="text" placeholder="New tub name" hidden />

        <label>Box (leave as "loose" if it isn't boxed)
          <select id="boxSelect"></select>
        </label>
        <input id="newBoxName" type="text" placeholder="New box name" hidden />

        <button type="submit" id="submitBtn">Add item</button>
        <div class="addStatus" id="addStatus"></div>
      </form>
      <p class="offlineNote" id="offlineNote" style="display:none;">Adding isn't available in this view — search still works.</p>
    </div>
  </div>

 "tub": "TUB B"}, {"item": "saxophone", "container": "BOX 011 - General Magic", "tub": "TUB B"}, {"item": "Sven pads (another one bites the dust, bull shark)", "container": "BOX 011 - General Magic", "tub": "TUB B"}, {"item": "2 way notepads x2", "container": "BOX 011 - General Magic", "tub": "TUB B"}, {"item": "Antique boxes and magic", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "braille box", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "hexadecimal puzzle", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "bits n bobs baggy", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "magic design keepsakes", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "jumbo cards impossibottle", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "cheap-deepo cards", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "tip jar", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "rocks glasses x2", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "square card reader", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "matchstick puzzles set", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "lenses", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "large glass ball & base", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "impossi-puzzle", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "sculpting balloons", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "Phenakistoscope & animation discs", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "spade salt & pepper shakers", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "wands", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "playing card pens", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "paper miracles books and covers", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "cheap linking rings", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "anamorphic balloon picture", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "sign easel", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "spandex 6 foot table cover", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "plastic ziplock bags (various)", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "plastic containers", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "velvet material", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "doodle boards", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "yarn", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "Halloween magic record player sign", "container": "TUB C (loose)", "tub": "TUB C"}, {"item": "Ball Escape Tricks", "container": "BOX 013", "tub": "TUB C"}, {"item": "Various playing cards", "container": "BOX 014 (clear, unmarked tub)", "tub": "TUB C"}]};

  const STATE = { tubs: FALLBACK.tubs.slice(), boxes: FALLBACK.boxes.slice(), items: FALLBACK.items.slice() };
  let dbRef = null; // resolved db capability, or null if unavailable

  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('emptyState');
  const subheadEl = document.getElementById('subhead');

  const toggleAddBtn = document.getElementById('toggleAdd');
  const addForm = document.getElementById('addForm');
  const newItemName = document.getElementById('newItemName');
  const tubSelect = document.getElementById('tubSelect');
  const newTubName = document.getElementById('newTubName');
  const boxSelect = document.getElementById('boxSelect');
  const newBoxName = document.getElementById('newBoxName');
  const submitBtn = document.getElementById('submitBtn');
  const addStatus = document.getElementById('addStatus');
  const offlineNote = document.getElementById('offlineNote');

  const NEW_VALUE = '__new__';
  const LOOSE_VALUE = '__loose__';

  function slug(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateSubhead() {
    const boxCount = STATE.boxes.length;
    const tubCount = STATE.tubs.length;
    subheadEl.textContent = STATE.items.length + ' items, ' + tubCount +
      (tubCount === 1 ? ' tub, ' : ' tubs, ') + boxCount + (boxCount === 1 ? ' box.' : ' boxes.');
  }

  function stem(term) {
    return term.endsWith('s') && term.length > 1 ? term.slice(0, -1) : term;
  }

  function blob(row) {
    return (row.item + ' ' + row.container + ' ' + row.tub).toLowerCase();
  }

  function renderResults(query) {
    const q = query.trim().toLowerCase();

    if (!q) {
      resultsEl.innerHTML = '';
      statusEl.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Start typing above — results will show up here.';
      return;
    }

    const s = stem(q);
    const matches = STATE.items.filter(row => {
      const b = blob(row);
      return b.includes(q) || b.includes(s);
    });

    emptyEl.style.display = matches.length ? 'none' : 'block';
    if (!matches.length) {
      emptyEl.textContent = 'Nothing matches "' + query.trim() + '". Try a shorter or different word.';
      resultsEl.innerHTML = '';
      statusEl.style.display = 'none';
      return;
    }

    statusEl.style.display = 'flex';
    countEl.textContent = matches.length + (matches.length === 1 ? ' match' : ' matches');

    resultsEl.innerHTML = matches.map(row => (
      '<li class="row" title="Click to copy" data-item="' + row.item.replace(/"/g, '&quot;') + '">' +
        '<span class="item">' + escapeHtml(row.item) + '</span>' +
        '<span class="loc"><span class="box">' + escapeHtml(row.container) + '</span>' +
        '<span class="tub">' + escapeHtml(row.tub) + '</span></span>' +
      '</li>'
    )).join('');
  }

  resultsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const text = row.getAttribute('data-item');
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    row.style.background = 'rgba(169,121,60,0.18)';
    setTimeout(() => { row.style.background = ''; }, 300);
  });

  searchEl.addEventListener('input', (e) => renderResults(e.target.value));

  // ---- Add-item form ----

  function populateTubSelect() {
    tubSelect.innerHTML = STATE.tubs.map(t => '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>').join('')
      + '<option value="' + NEW_VALUE + '">+ New tub…</option>';
  }

  function populateBoxSelect() {
    const chosenTub = tubSelect.value === NEW_VALUE ? null : tubSelect.value;
    const boxesForTub = chosenTub ? STATE.boxes.filter(b => b.tub === chosenTub) : [];
    boxSelect.innerHTML = '<option value="' + LOOSE_VALUE + '">Loose in the tub (no box)</option>'
      + boxesForTub.map(b => '<option value="' + escapeHtml(b.name) + '">' + escapeHtml(b.name) + '</option>').join('')
      + '<option value="' + NEW_VALUE + '">+ New box…</option>';
  }

  toggleAddBtn.addEventListener('click', () => {
    const willShow = addForm.hidden;
    addForm.hidden = !willShow;
    toggleAddBtn.textContent = willShow ? '– Close' : '+ Add an item';
    if (willShow) {
      populateTubSelect();
      populateBoxSelect();
      newItemName.focus();
    }
  });

  tubSelect.addEventListener('change', () => {
    newTubName.hidden = tubSelect.value !== NEW_VALUE;
    if (tubSelect.value !== NEW_VALUE) populateBoxSelect();
    else boxSelect.innerHTML = '<option value="' + LOOSE_VALUE + '">Loose in the tub (no box)</option>';
  });

  boxSelect.addEventListener('change', () => {
    newBoxName.hidden = boxSelect.value !== NEW_VALUE;
  });

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!dbRef) return;

    const itemName = newItemName.value.trim();
    if (!itemName) return;

    const tubName = tubSelect.value === NEW_VALUE ? newTubName.value.trim() : tubSelect.value;
    if (!tubName) {
      addStatus.textContent = 'Enter a tub name.';
      addStatus.className = 'addStatus err';
      return;
    }

    let container, newBox = null;
    if (boxSelect.value === LOOSE_VALUE) {
      container = tubName + ' (loose)';
    } else if (boxSelect.value === NEW_VALUE) {
      const boxName = newBoxName.value.trim();
      if (!boxName) {
        addStatus.textContent = 'Enter a box name.';
        addStatus.className = 'addStatus err';
        return;
      }
      container = boxName;
      if (!STATE.boxes.some(b => b.name === boxName && b.tub === tubName)) newBox = { name: boxName, tub: tubName };
    } else {
      container = boxSelect.value;
    }

    const isNewTub = !STATE.tubs.includes(tubName);

    submitBtn.disabled = true;
    addStatus.textContent = 'Saving…';
    addStatus.className = 'addStatus';

    try {
      if (isNewTub) {
        await dbRef.collection('tubs').doc(slug(tubName)).set({ name: tubName });
      }
      if (newBox) {
        await dbRef.collection('boxes').doc(slug(newBox.tub) + '__' + slug(newBox.name)).set(newBox);
      }
      await dbRef.collection('items').add({ item: itemName, container: container, tub: tubName });

      if (isNewTub) STATE.tubs.push(tubName);
      if (newBox) STATE.boxes.push(newBox);
      STATE.items.push({ item: itemName, container: container, tub: tubName });

      addStatus.textContent = 'Saved.';
      addStatus.className = 'addStatus ok';
      newItemName.value = '';
      newTubName.value = '';
      newBoxName.value = '';
      populateTubSelect();
      tubSelect.value = tubName;
      populateBoxSelect();
      updateSubhead();
      if (searchEl.value.trim()) renderResults(searchEl.value);
    } catch (err) {
      addStatus.textContent = 'Could not save — try again.';
      addStatus.className = 'addStatus err';
    }
    submitBtn.disabled = false;
  });

  async function loadFromDb() {
    if (typeof claude === 'undefined' || !claude.use) {
      toggleAddBtn.style.display = 'none';
      offlineNote.style.display = 'block';
      return;
    }
    try {
      const db = await claude.use('db');
      if (!db) {
        toggleAddBtn.style.display = 'none';
        offlineNote.style.display = 'block';
        return;
      }
      dbRef = db;
      const [tubsSnap, boxesSnap, itemsSnap] = await Promise.all([
        db.collection('tubs').limit(1000).get(),
        db.collection('boxes').limit(1000).get(),
        db.collection('items').limit(1000).get(),
      ]);
      if (itemsSnap.docs.length) {
        STATE.items = itemsSnap.docs.map(d => d.data());
      }
      if (tubsSnap.docs.length) {
        STATE.tubs = tubsSnap.docs.map(d => d.data().name).filter(Boolean);
      }
      if (boxesSnap.docs.length) {
        STATE.boxes = boxesSnap.docs.map(d => d.data());
      }
      updateSubhead();
      if (searchEl.value.trim()) renderResults(searchEl.value);
      if (!addForm.hidden) { populateTubSelect(); populateBoxSelect(); }
    } catch (err) {
      toggleAddBtn.style.display = 'none';
      offlineNote.style.display = 'block';
    }
  }

  updateSubhead();
  renderResults('');
  loadFromDb();
})();
